[package]
name = "secrets-cli"
version = "3.4.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Alexey Makrushin"]
description = "CLI tool for managing secrets with Bitwarden integration"

[[bin]]
name = "secrets"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Cryptography
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
hmac = "0.12"

# Security
secrecy = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.21"

# System
dirs = "5"
regex = "1"
rpassword = "7"

# Error handling
thiserror = "1"

# Async (for bitwarden calls)
# Not using async for simplicity - using blocking calls

[dev-dependencies]
# Пусто намеренно: assert_cmd и predicates не использовались ни в одном тесте,
# а tempfile тянул сеть при каждом `cargo test`. Временные каталоги тесты
# делают сами, через std.

[profile.release]
opt-level = 3
lto = true
strip = true
